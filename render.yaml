services:
  # ========================================================
  # Ecosystem Core API
  # ========================================================
  - type: web
    name: ecosystem-core-api
    runtime: node
    rootDir: ecosystem-core/backend
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: KEYCLOAK_URL
        sync: false

  # ========================================================
  # HRFlow Backend API
  # ========================================================
  - type: web
    name: hrflow-api
    runtime: node
    rootDir: applications/HRFlow/backend
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ECOSYSTEM_CORE_API_URL
        sync: false
      - key: KEYCLOAK_URL
        sync: false

  # ========================================================
  # MAINTLY Backend API
  # ========================================================
  - type: web
    name: maintly-api
    runtime: node
    rootDir: applications/Maintly/backend
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HRFLOW_API_URL
        sync: false
      - key: KEYCLOAK_URL
        sync: false
