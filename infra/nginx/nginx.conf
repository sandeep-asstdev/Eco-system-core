worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zone (30 requests/sec per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstream Services
    upstream portal_upstream {
        server ecosystem-portal:80;
    }

    upstream hrflow_web_upstream {
        server hrflow-web:80;
    }

    upstream maintly_web_upstream {
        server maintly-web:80;
    }

    upstream core_api_upstream {
        server ecosystem-core-api:4000;
    }

    upstream hrflow_api_upstream {
        server hrflow-api:5000;
    }

    upstream maintly_api_upstream {
        server maintly-api:5002;
    }

    upstream keycloak_upstream {
        server keycloak:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Keycloak OIDC Identity Gateway
        location /auth/ {
            proxy_pass http://keycloak_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Central Ecosystem Core API
        location /api/core/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # HRFlow API Gateway
        location /api/hr/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://hrflow_api_upstream/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MAINTLY API Gateway
        location /api/maintly/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://maintly_api_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # HRFlow Web Application
        location /hr/ {
            proxy_pass http://hrflow_web_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MAINTLY Web Application
        location /maintly/ {
            proxy_pass http://maintly_web_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Central Ecosystem Portal (Root SPA)
        location / {
            proxy_pass http://portal_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
