version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: maintly_postgres18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maintly_db
    ports:
      - "5433:5432"
    volumes:
      - maintly_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: maintly_api
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/maintly_db?schema=public
      JWT_SECRET: maintly_prod_secure_secret_key_change_in_production
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: maintly_web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  maintly_pgdata:
